name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax check frontend
        run: node --check static/js/app.js
      - name: Run engine test suite
        run: pytest tests/ -v --tb=short
      - name: Boot server smoke test
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 4
          curl -sf http://localhost:8000/api/health
          curl -sf http://localhost:8000/api/stats > /dev/null
          curl -sf "http://localhost:8000/api/resources?lat=12.311&lng=76.642&type=hospital" > /dev/null
          curl -sf http://localhost:8000/api/disaster/flood > /dev/null
          curl -sf -X POST http://localhost:8000/api/voice -H "Content-Type: application/json" -d '{"message":"no water supply urgent"}' > /dev/null
          echo "SMOKE TEST PASSED"
