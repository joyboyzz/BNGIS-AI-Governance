<svg width="1280" height="340" viewBox="0 0 1280 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#101838"/>
      <stop offset="100%" stop-color="#0d1530"/>
    </linearGradient>
    <linearGradient id="tricolor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#2eb872"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c8cff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <circle cx="1050" cy="170" r="240" fill="url(#glow)"/>

  <!-- subtle grid dots -->
  <g fill="#22305e" opacity="0.5">
    <circle cx="60" cy="300" r="2"/><circle cx="120" cy="300" r="2"/><circle cx="180" cy="300" r="2"/>
    <circle cx="60" cy="250" r="2"/><circle cx="120" cy="250" r="2"/><circle cx="180" cy="250" r="2"/>
  </g>

  <!-- tricolor bottom strip -->
  <rect x="0" y="326" width="426" height="6" fill="#ff9933"/>
  <rect x="426" y="326" width="428" height="6" fill="#f5f5f5"/>
  <rect x="854" y="326" width="426" height="6" fill="#138808"/>

  <!-- ===== neural network graphic (right) ===== -->
  <g transform="translate(880,60)">
    <!-- edges layer1->layer2 -->
    <g stroke="#3a4a8a" stroke-width="1.4" opacity="0.8">
      <line x1="60" y1="30" x2="140" y2="60"/><line x1="60" y1="30" x2="140" y2="110"/><line x1="60" y1="30" x2="140" y2="160"/>
      <line x1="60" y1="110" x2="140" y2="60"/><line x1="60" y1="110" x2="140" y2="110"/><line x1="60" y1="110" x2="140" y2="160"/>
      <line x1="60" y1="190" x2="140" y2="110"/><line x1="60" y1="190" x2="140" y2="160"/><line x1="60" y1="190" x2="140" y2="210"/>
      <line x1="60" y1="60" x2="140" y2="160" opacity="0.4"/>
    </g>
    <!-- edges layer2->layer3 -->
    <g stroke="#7c8cff" stroke-width="1.6" opacity="0.75">
      <line x1="140" y1="60" x2="230" y2="105"/><line x1="140" y1="110" x2="230" y2="105"/>
      <line x1="140" y1="160" x2="230" y2="105"/><line x1="140" y1="110" x2="230" y2="165"/>
      <line x1="140" y1="160" x2="230" y2="165"/><line x1="140" y1="210" x2="230" y2="165"/>
    </g>
    <!-- edges layer3->output -->
    <g stroke="#2eb872" stroke-width="1.8" opacity="0.85">
      <line x1="230" y1="105" x2="305" y2="135"/><line x1="230" y1="165" x2="305" y2="135"/>
    </g>
    <!-- nodes -->
    <g>
      <circle cx="60" cy="30" r="10" fill="#ff9933"/><circle cx="60" cy="60" r="10" fill="#ff9933" opacity="0.85"/>
      <circle cx="60" cy="110" r="10" fill="#ffb877"/><circle cx="60" cy="190" r="10" fill="#ff9933" opacity="0.85"/>
      <circle cx="140" cy="60" r="11" fill="#7c8cff"/><circle cx="140" cy="110" r="11" fill="#8f9bff"/>
      <circle cx="140" cy="160" r="11" fill="#7c8cff"/><circle cx="140" cy="210" r="11" fill="#7c8cff" opacity="0.8"/>
      <circle cx="230" cy="105" r="12" fill="#38d6d0"/><circle cx="230" cy="165" r="12" fill="#38d6d0" opacity="0.85"/>
      <circle cx="305" cy="135" r="15" fill="#2eb872"/>
      <circle cx="305" cy="135" r="24" fill="none" stroke="#2eb872" stroke-opacity="0.4" stroke-width="2"/>
    </g>
    <!-- pulse rings on output -->
    <circle cx="305" cy="135" r="32" fill="none" stroke="#2eb872" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle cx="305" cy="135" r="41" fill="none" stroke="#2eb872" stroke-opacity="0.1" stroke-width="1.5"/>
  </g>

  <!-- ===== text ===== -->
  <text x="70" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="19" letter-spacing="7" fill="#8f9bff" font-weight="600">BHARATH • NEURO • GOVERNANCE • INTELLIGENCE</text>
  <text x="64" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="86" font-weight="800" fill="url(#titleGrad)" letter-spacing="2">BNGIS</text>
  <text x="70" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#c9d2f0">An AI brain connecting every citizen to every government resource — in real time.</text>

  <!-- stat chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="700">
    <rect x="70" y="240" width="150" height="38" rx="19" fill="#16204a" stroke="#7c8cff" stroke-opacity="0.55"/>
    <text x="145" y="265" fill="#b9c3ff" text-anchor="middle">8 AI Modules</text>
    <rect x="234" y="240" width="140" height="38" rx="19" fill="#16204a" stroke="#2eb872" stroke-opacity="0.55"/>
    <text x="304" y="265" fill="#9fe8c2" text-anchor="middle">25 Tests ✓</text>
    <rect x="388" y="240" width="160" height="38" rx="19" fill="#16204a" stroke="#38d6d0" stroke-opacity="0.55"/>
    <text x="468" y="265" fill="#9fe8e4" text-anchor="middle">4 Languages</text>
    <rect x="562" y="240" width="120" height="38" rx="19" fill="#16204a" stroke="#ff9933" stroke-opacity="0.55"/>
    <text x="622" y="265" fill="#ffc899" text-anchor="middle">₹0 Cost</text>
  </g>

  <!-- built for Bharat tag -->
  <text x="70" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5d6684">Built with ❤️ for Bharat · 100% Free &amp; Open Source · MIT License</text>
</svg>
